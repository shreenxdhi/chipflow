name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-24.04']
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y iverilog make
      - run: python -m pip install --constraint requirements-runtime.txt -e '.[test]'
      - run: python -m pytest -q
      - run: node --check chipflow/static/app.js
  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y iverilog make
      - run: python -m pip install --constraint requirements-runtime.txt -e '.[test,dev]'
      - run: ruff check chipflow tests scripts
      - run: ruff format --check chipflow tests scripts
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_distribution.py dist
      - run: python scripts/wheel_smoke.py dist/*.whl --require-sim
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distributions
          path: dist/*
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y iverilog make
      - run: python -m pip install --constraint requirements-runtime.txt -e '.[test,browser-test]'
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the browser in a fresh workspace
        env:
          CHIPFLOW_URL: http://127.0.0.1:8765
        run: |
          python -m chipflow --runs .chipflow/browser-validation/runs serve --port 8765 > browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python -c 'import time,urllib.request; time.sleep(2); urllib.request.urlopen("http://127.0.0.1:8765/api/health",timeout=10)'
          python tests/browser_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: browser-failure
          include-hidden-files: true
          path: |
            browser-server.log
            .chipflow/browser-test-artifacts
  container:
    needs: distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: distributions
          path: dist/
      - run: docker build -f packaging/Dockerfile.smoke -t chipflow-smoke .
