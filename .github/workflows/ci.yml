name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y iverilog make
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: node --check chipflow/static/app.js
  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y iverilog make
      - run: python -m pip install -e '.[test,dev]'
      - run: ruff check chipflow tests scripts
      - run: ruff format --check chipflow tests scripts
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_distribution.py dist
      - run: python scripts/wheel_smoke.py dist/*.whl --require-sim
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distributions
          path: dist/*
