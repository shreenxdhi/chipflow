name: Dependency audit
on:
  schedule:
    - cron: '25 6 * * 1'
  workflow_dispatch:
  push:
    paths: ['requirements-runtime.txt', '.github/workflows/audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install 'pip-audit>=2,<3'
      - run: pip-audit -r requirements-runtime.txt --no-deps --disable-pip --format cyclonedx-json --output dependency-sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dependency-sbom
          path: dependency-sbom.json
