[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chipflow"
dynamic = ["version", "dependencies"]
description = "Local RTL-to-GDS workflow manager with terminal and browser dashboards"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Shreenidhi V"}]
keywords = ["eda", "rtl", "gds", "openroad", "yosys", "asic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console :: Curses",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/shreenxdhi/chipflow"
Documentation = "https://github.com/shreenxdhi/chipflow/tree/main/docs"
Repository = "https://github.com/shreenxdhi/chipflow"
Issues = "https://github.com/shreenxdhi/chipflow/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
dev = ["build>=1,<2", "twine>=6,<8", "ruff>=0.12,<1", "pip-audit>=2,<3"]
verification = ["cocotb>=2,<3"]
physical = ["klayout>=0.30,<0.31"]
browser-test = ["playwright>=1.50,<2"]

[project.scripts]
chipflow = "chipflow.cli:main"

[tool.setuptools.dynamic]
version = {attr = "chipflow.__version__"}
dependencies = {file = ["requirements-runtime.txt"]}

[tool.setuptools.packages.find]
include = ["chipflow*"]

[tool.setuptools.package-data]
chipflow = ["static/*", "examples/counter/*.v", "examples/counter/*.yaml", "examples/counter/*.md", "examples/counter/tcl/*.tcl", "examples/fifo/*", "examples/multiclock/*", "examples/tiny_cpu/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".chipflow", ".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
